    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1000 150) rotate(130) scale(520)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fbbf24" stop-opacity="0.16"/><stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
