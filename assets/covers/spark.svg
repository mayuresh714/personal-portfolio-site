  <rect x="80" y="96" width="320" height="48" rx="24" fill="#7c9cff" fill-opacity="0.12" stroke="#7c9cff" stroke-opacity="0.35"/>
  <text x="106" y="127" font-family="Inter, Arial, sans-serif" font-size="21" font-weight="700" letter-spacing="2" fill="#a5b8ff">BIG DATA · PERFORMANCE</text>
